<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anh hùng pixel">
<meta name="theme-color" content="#17112f">
<meta name="description" content="Anime-inspired 2D RPG thời trang, nhiệm vụ và sưu tầm trang phục cho trẻ em">
<title>Anh Hùng Pixel V25 – Arms Outward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#e6e0ff;--pn:#ffffff;--pn2:#efeaff;--bd:#1b1440;--tx:#1b1440;--mu:#5d548f;
  --gold:#ffc72c;--grn:#2fbf71;--red:#e5383b;--cy:#2ec4f1;--pu:#7b4fe0;
  --hi:rgba(255,255,255,.6);--sh:rgba(27,20,64,.22);--on:#1b1440;
  --font:'VT323',ui-monospace,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17112f;--pn:#2b2260;--pn2:#211a4d;--bd:#0a0719;--tx:#fff6dd;--mu:#b9b0f2;--hi:rgba(255,255,255,.14);--sh:rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#17112f;--pn:#2b2260;--pn2:#211a4d;--bd:#0a0719;--tx:#fff6dd;--mu:#b9b0f2;--hi:rgba(255,255,255,.14);--sh:rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:22px;line-height:1.12;-webkit-tap-highlight-color:transparent;font-synthesis:none}
#app{max-width:520px;margin:0 auto;padding:10px 10px calc(86px + env(safe-area-inset-bottom,0px))}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
h2,h3{margin:0;font-weight:400;line-height:1}
h2{font-size:28px;margin:16px 2px 8px}
h3{font-size:24px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.px{background:var(--pn);border:4px solid var(--bd);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--sh),0 4px 0 var(--bd);padding:10px 12px;margin-bottom:12px}
.btn{border:4px solid var(--bd);background:var(--gold);color:var(--on);padding:6px 12px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.5),inset -3px -3px 0 rgba(0,0,0,.2),0 4px 0 var(--bd);line-height:1}
.btn:active{transform:translateY(3px);box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(0,0,0,.2),0 1px 0 var(--bd)}
.btn.alt{background:var(--pn2);color:var(--tx)}
.btn.red{background:var(--red);color:#fff}
.btn.pu{background:var(--pu);color:#fff}
.btn.grn{background:var(--grn);color:#fff}
.btn.sm{padding:3px 8px;font-size:19px}
.btn.full{width:100%;margin-top:8px}
.btn[disabled]{opacity:.45;transform:none;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mu{color:var(--mu)}
.sm2{font-size:18px;color:var(--mu)}

/* bars */
.bar{position:relative;height:22px;border:4px solid var(--bd);background:var(--pn2);margin-top:6px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--cy);transition:width .35s steps(8)}
.bar>i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.16) 6px 8px)}
.bar.sta>i{background:var(--grn)}.bar.hp>i{background:var(--red)}.bar.day>i{background:var(--gold)}.bar.pet>i{background:var(--pu)}
.bar>span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;line-height:1}

/* scene */
.scene{position:relative;height:280px;border:4px solid var(--bd);overflow:hidden;margin-bottom:12px;box-shadow:0 4px 0 var(--bd)}
.sc-day{background:linear-gradient(#5fb8ff 0 34%,#7cc7ff 34% 60%,#a5dbff 60%)}
.sc-dusk{background:linear-gradient(#4b3694 0 28%,#b44b8a 28% 52%,#ff8f6b 52% 76%,#ffc98a 76%)}
.sc-night{background:linear-gradient(#0a0828 0 38%,#150f45 38% 68%,#241b66 68%)}
.cloud{position:absolute;width:12px;height:12px;background:#fff;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,12px -12px #fff,24px -12px #fff;opacity:.92}
.sc-night .cloud{opacity:.12}
.star{position:absolute;width:4px;height:4px;background:#fff8c0;display:none}
.sc-night .star{display:block}
.ground{position:absolute;left:0;right:0;bottom:0;height:44px;background:repeating-linear-gradient(90deg,#4fb558 0 16px,#43a34c 16px 32px);border-top:4px solid #2c7a35}
.ground::after{content:"";position:absolute;left:0;right:0;top:12px;bottom:0;background:#8a6a55 repeating-linear-gradient(90deg,transparent 0 24px,rgba(0,0,0,.14) 24px 28px)}
.scene>canvas.bg{position:absolute;left:0;top:0;width:100%;height:100%}
.hero-cv{position:absolute;left:50%;bottom:24px;width:250px;height:250px;transform:translateX(-50%);animation:idle 1.2s steps(2) infinite;z-index:2}
.pet-cv{position:absolute;left:50%;bottom:27px;width:58px;height:52px;animation:petPatrol 9s linear infinite alternate;z-index:1;pointer-events:none}
.tagline{position:absolute;left:8px;top:8px;background:rgba(10,7,25,.7);color:#fff;padding:3px 8px;font-size:20px}
@keyframes idle{50%{transform:translateX(-50%) translateY(-3px)}}
.pet-cv{animation-name:petPatrol}
@keyframes petPatrol{0%{transform:translateX(-245px) translateY(0)}25%{transform:translateX(-125px) translateY(-2px)}50%{transform:translateX(0) translateY(0)}75%{transform:translateX(125px) translateY(-2px)}100%{transform:translateX(245px) translateY(0)}}

/* list rows */
.row2{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px}
.row2 .tm{flex:none;width:52px;color:var(--mu)}
.row2 .ic{flex:none;font-size:30px;width:36px;text-align:center;line-height:1}
.row2 .tx{flex:1;min-width:0}
.row2 .nm{overflow-wrap:anywhere}
.row2.done{opacity:.6}.row2.done .nm{text-decoration:line-through}
.row2.spec{border-color:var(--pu)}
.tag{display:inline-block;font-size:16px;padding:0 6px;margin-left:6px;border:2px solid var(--bd);background:var(--gold);color:var(--on);vertical-align:middle}
.tag.red{background:var(--red);color:#fff}
.ck{flex:none;width:44px;height:44px;border:4px solid var(--bd);background:var(--pn2);font-size:28px;line-height:1;box-shadow:0 3px 0 var(--bd);display:grid;place-items:center;padding:0}
.ck:active{transform:translateY(2px)}
.row2.done .ck{background:var(--grn);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:3px solid var(--bd);background:var(--pn2);padding:2px 8px;font-size:19px;line-height:1.1}
.chip[disabled]{opacity:.4}

/* grids */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1;border:4px solid var(--bd);background:var(--pn2);padding:3px;display:grid;place-items:center;position:relative;min-width:0}
.cell canvas{width:100%;height:100%;object-fit:contain}
.cell small{position:absolute;left:2px;bottom:0;font-size:14px;color:var(--mu)}
.cell.eqd{border-style:dashed}
.subs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.subs button{flex:1;white-space:nowrap;border:4px solid var(--bd);background:var(--pn2);padding:4px 6px;line-height:1}
.subs button.on{background:var(--gold);color:var(--on)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:19px}

/* cards */
.mcard{display:flex;gap:10px;align-items:center}
.mcard canvas{flex:none;width:110px;height:110px}
.pip{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);background:var(--pn2);margin-right:3px}
.pip.on{background:var(--gold)}
.cls{display:flex;gap:8px;align-items:center}
.cls .ic{font-size:34px;width:44px;text-align:center;flex:none}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--pn);border-top:4px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;padding:6px 0 5px;font-size:17px;color:var(--mu);display:grid;justify-items:center;line-height:1.05}
nav button span{font-size:26px;line-height:1.1}
nav button.on{color:var(--tx);background:var(--pn2)}

/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,7,25,.7);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:100%;max-width:380px;text-align:center;margin:0}
.modal .big{font-size:60px;line-height:1.1}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts .btn{flex:1;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bd);color:#fff;padding:6px 14px;max-width:92%;text-align:center;border:3px solid var(--gold)}
.arena{display:flex;justify-content:space-around;align-items:flex-end;margin:6px 0;position:relative}
.arena canvas{width:110px;height:auto}
.ar-m{width:132px!important}
.shake{animation:shake .4s steps(4) 1}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dmg{position:absolute;right:18px;top:0;font-size:40px;color:#ff4d4d;text-shadow:2px 2px 0 #000;animation:up 1s steps(8) forwards}
.dmg.crit{color:var(--gold)}
@keyframes up{from{transform:translateY(30px);opacity:1}to{transform:translateY(-14px);opacity:1}}
.pulse{animation:pl .6s steps(2) 4}
@keyframes pl{50%{transform:scale(1.12)}}
input,select,textarea{border:4px solid var(--bd);background:var(--pn2);padding:6px 8px;width:100%;line-height:1.1}
label{display:grid;gap:3px;color:var(--mu);font-size:18px}
.form{display:grid;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;gap:3px;align-items:center;border:3px solid var(--bd);padding:2px 6px;background:var(--pn2);color:var(--tx)}
.days input{width:auto}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk button{width:44px;height:44px;border:4px solid var(--bd);background:var(--pn2);font-size:26px;padding:0;line-height:1}
.pk button.on{background:var(--gold)}
.sw{width:34px!important;height:34px!important}
.welcome{margin-top:14px}
.welcome .scene{height:260px}
@media (prefers-reduced-motion:reduce){.hero-cv,.pet-cv,.shake,.dmg,.pulse{animation:none}.bar>i{transition:none}}


/* Anime-inspired 2D MMORPG art direction */
body{background:radial-gradient(ellipse at 50% -10%,#51408f 0,#251a52 36%,var(--bg) 78%);background-attachment:fixed}
#app{max-width:620px}
.px{border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),0 5px 0 var(--bd),0 10px 22px rgba(16,8,44,.12)}
.scene{height:310px;border-width:4px;background-color:#25255a;box-shadow:0 5px 0 var(--bd),0 0 24px rgba(117,83,255,.22)}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 34%,rgba(20,12,53,.16));mix-blend-mode:screen}
.hero-cv{filter:drop-shadow(0 5px 0 rgba(12,8,35,.28)) drop-shadow(0 0 8px rgba(255,231,153,.12))}
.btn{border-radius:3px;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08)}
.fashion-stage{min-height:410px;background:radial-gradient(ellipse at 50% 26%,#7354bd 0,#30215f 38%,#11152f 78%);border-color:#a58bfa;box-shadow:inset 0 0 0 3px rgba(255,255,255,.09),0 6px 0 var(--bd),0 0 24px rgba(124,58,237,.18)}
.fashion-stage:after{content:"✦   ·   ✧    ·   ✦    ·   ✧";display:block;color:#fff0ad;font-size:18px;letter-spacing:7px;opacity:.8}
.fashion-stage canvas{image-rendering:pixelated;filter:drop-shadow(0 10px 0 rgba(0,0,0,.24)) drop-shadow(0 0 10px rgba(255,255,255,.13))}
.event-banner{border-radius:4px;background:linear-gradient(115deg,#171b48 0%,#5032a3 40%,#a63d91 72%,#ff945c 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.13),0 5px 0 var(--bd),0 12px 25px rgba(45,20,95,.2);position:relative;overflow:hidden}
.event-banner:after{content:"✦ ✧ ✦";position:absolute;right:8px;top:6px;color:#ffe8a3;letter-spacing:5px;opacity:.7}
.fashion-card{border-radius:4px;background:linear-gradient(155deg,var(--pn),var(--pn2));box-shadow:0 4px 0 var(--bd),inset 0 0 0 1px rgba(255,255,255,.15);transition:transform .15s,box-shadow .15s}
.fashion-card:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--bd),0 0 15px rgba(124,58,237,.18)}
.fashion-card canvas{width:92px;height:112px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.anime-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.anime-card{border:3px solid var(--bd);padding:10px;background:linear-gradient(150deg,#fff,var(--pn2));box-shadow:0 4px 0 var(--bd);min-width:0;position:relative;overflow:hidden}
.anime-card .poster{height:90px;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle at 50% 25%,var(--glow,#c4b5fd),transparent 58%),linear-gradient(135deg,#211744,#3a2a70);border:2px solid rgba(255,255,255,.3);margin-bottom:8px;text-shadow:0 3px 0 #17112f}
.anime-card .poster span{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.anime-card .title{font-size:23px;line-height:1.05;min-height:42px}
.anime-card .subtitle{font-size:17px;color:var(--mu);min-height:40px;margin:4px 0}
.collab-note{border:2px dashed #9a80ef;background:rgba(124,58,237,.08);padding:8px 10px;font-size:18px;margin:8px 0 12px}
@media(min-width:520px){.anime-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){.anime-grid{gap:6px}.anime-card{padding:6px}.anime-card .poster{height:76px;font-size:40px}}

/* Fashion RPG expansion */
.fashion-stage{background:radial-gradient(ellipse at 50% 25%,#43317e,#17112f 75%);border:4px solid var(--bd);padding:12px;text-align:center;position:relative;overflow:visible;min-width:0}
.fashion-stage:before{content:"✦  ✧     ✦       ✧  ✦";display:block;color:#ffe58a;letter-spacing:10px;font-size:20px}
.fashion-stage canvas{width:320px;height:360px;max-width:100%;margin:0 auto;image-rendering:pixelated;filter:drop-shadow(0 8px 0 rgba(0,0,0,.22));transition:transform .25s}
.fashion-stage .try-actions{display:flex;justify-content:center;margin-top:8px}
.fashion-stage .try-actions button{font-size:18px}
.fashion-cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0 12px;padding:3px 2px 7px;scrollbar-width:thin}
.fashion-cats button{flex:none;white-space:nowrap;border:3px solid var(--bd);background:var(--pn2);padding:5px 10px;line-height:1;border-radius:3px}
.fashion-cats button.on{background:var(--gold);color:var(--on);box-shadow:0 3px 0 var(--bd)}
.fashion-count{margin:4px 0 8px;color:var(--mu);font-size:18px}
.fashion-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.fashion-card{border:4px solid var(--bd);background:var(--pn);padding:8px;min-width:0;box-shadow:0 3px 0 var(--bd)}
.fashion-card canvas{width:80px;height:100px;margin:auto;image-rendering:pixelated}
.fashion-card .name{min-height:38px;overflow-wrap:anywhere}
.mount-card{display:flex;align-items:center;gap:10px;padding:10px;border:3px solid var(--bd);background:var(--pn2);margin:8px 0}
.mount-icon{font-size:46px;min-width:58px;text-align:center}
.event-banner{background:linear-gradient(120deg,#38206f,#9a3fc0,#ff8c5a);color:white;border:4px solid var(--bd);padding:14px;margin:10px 0;text-shadow:1px 2px #21113c}
@media(min-width:420px){.fashion-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){body{font-size:20px}#app{padding-left:7px;padding-right:7px}.fashion-stage canvas{width:250px;height:300px}.fashion-grid{gap:6px}.fashion-card{padding:5px}}



/* V6: pet patrols across the scene; character remains visually in front */
.hero-cv{z-index:2}
.pet-cv{left:50%;bottom:27px;width:58px;height:52px;z-index:1;pointer-events:none;animation:petPatrol 9s linear infinite alternate}
@keyframes petPatrol{0%{transform:translateX(-245px) translateY(0)}25%{transform:translateX(-125px) translateY(-2px)}50%{transform:translateX(0) translateY(0)}75%{transform:translateX(125px) translateY(-2px)}100%{transform:translateX(245px) translateY(0)}}
.fashion-stage .try-actions{display:flex;justify-content:center;margin-top:8px}
</style>
<!-- V24: Dedicated Anime Set equipment slot; normal equipment is preserved. -->
<!-- V25: arm angles corrected outward: left arm +15deg, right arm -15deg. -->
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
(function(){
'use strict';
var KEY='anh-hung-pixel-v1';
var HY=10,TY=22,LY=34,BY=38,CW=64,CH=50,COST=10,MAXLV=50;
var S,tab='home',sub={char:'equip',shop:'gear'},unlocked=false,gate=null;
var fashionCategory='all';
var draft={name:'',skin:0,hair:1,hs:0,gender:'girl'};
var Q=[],notes=[];
var dIcon='⭐',mKind='slime',mTier=1,rIcon='🎁',draftNotes={};

/* ---------- helpers ---------- */
function pad(n){return n<10?'0'+n:''+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function today(){return keyOf(new Date())}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a,r){return a[Math.floor((r||Math.random)()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dow(k){return parseKey(k).getDay()}
function weekKey(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return keyOf(x)}
function dueTs(k,t){var d=parseKey(k),p=t.split(':');d.setHours(+p[0],+p[1],0,0);return d.getTime()}
function shade(hex,a){if(!hex||hex[0]!=='#'||hex.length!==7)return hex;var n=parseInt(hex.slice(1),16),r=clamp((n>>16)+a,0,255),g=clamp(((n>>8)&255)+a,0,255),b=clamp((n&255)+a,0,255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}

/* ---------- data: classes & skills ---------- */
var FAM={
  novice:{n:'Tân binh',col:'#6c8ebf',w:['sword1h','dagger','wand','shield','book','mace'],hs:['cap'],bs:['tunic'],eff:null},
  warrior:{n:'Chiến binh',col:'#c0392b',w:['sword1h','sword2h','shield','dao','axe','mace','glaive'],hs:['helm','cap'],bs:['plate','tunic'],eff:'dmg'},
  archer:{n:'Cung thủ',col:'#2e8b57',w:['bow','dagger','whip'],hs:['hood','cap'],bs:['leather','tunic'],eff:'crit'},
  mage:{n:'Pháp sư',col:'#3b5bdb',w:['staff','wand','orb','book'],hs:['hat'],bs:['robe'],eff:'xp'},
  rogue:{n:'Đạo chích',col:'#55556e',w:['dagger','sword1h','dao','whip'],hs:['hood'],bs:['leather'],eff:'drop'}
};
var CL=[],CLM={},SKM={};
function addC(id,n,fam,tier,minLv,icon,desc,sk){
  var c={id:id,n:n,fam:fam,tier:tier,minLv:minLv,icon:icon,desc:desc,sk:[]};
  sk.forEach(function(s,i){var o={id:id+'_'+i,cls:id,name:s[0],icon:s[1],eff:s[2],per:s[3]};c.sk.push(o);SKM[o.id]=o});

/* ---------- items ---------- */
function statsFor(it){
  var m=RAR[it.rar].m,t=it.tier,o;
  switch(it.slot){
    case 'weapon':o={atk:Math.round((4+t*6)*m*(it.hand===2?1.5:1))};break;
    case 'offhand':o=it.kind==='shield'?{sta:Math.round((4+t*4)*m),atk:t+1}:{atk:Math.round((3+t*4)*m),xp:Math.max(1,Math.round(m))};break;
    case 'head':o={sta:Math.round((3+t*3)*m)};break;
    case 'body':o={sta:Math.round((5+t*5)*m)};break;
    case 'boots':o={sta:Math.round((2+t*2)*m),regen:t>=2?1:0};break;
    case 'cape':o={gold:Math.round((1+t)*m)};break;
    case 'ring':o={luck:Math.round((1+t)*m)};break;
    default:o={xp:Math.round((1+t)*m)};
  }
  for(var k in o){if(!o[k])delete o[k]}
  return o;
}
function mk(slot,kind,tier,rar,extra){
  var it={id:uid(),slot:slot,kind:kind,tier:tier,rar:rar};
  if(extra)for(var k in extra)it[k]=extra[k];
  if(slot==='weapon')it.hand=HAND2[kind]?2:1;
  if(!it.name)it.name=KN[kind]+' '+TN[tier];
  it.st=statsFor(it);
  return it;
}
function fashionItem(f){return mk(f.slot,f.kind,2,'f',{fid:f.fid,name:f.name,c1:f.c1,c2:f.c2,f:1})}
function rollRar(r,b){
  var w=[['c',Math.max(20,58-b*6)],['u',25],['r',11+b*3],['e',4+b*2.5],['l',0.8+b*0.8]],t=0,i;
  w.forEach(function(x){t+=x[1]});var v=r()*t;
  for(i=0;i<w.length;i++){v-=w[i][1];if(v<=0)return w[i][0]}
  return 'c';
}
function dropItem(r,boost){
  var L=lvl(S.xp).l,fam=FAM[CLM[S.cls].fam];
  var t=Math.min(4,Math.floor((L-1)/8)),x=r();t+=x<.15?1:x<.25?-1:0;t=clamp(t,0,4);
  var q=r(),slot=q<.28?'weapon':q<.38?'offhand':pick(['head','body','boots','cape','ring','neck'],r),kind;
  var offs=fam.w.filter(function(w){return w==='shield'||w==='orb'});
  if(slot==='offhand'&&!offs.length)slot='body';
  if(slot==='weapon'){var ws=fam.w.filter(function(w){return w!=='shield'&&w!=='orb'});kind=r()<.85?pick(ws,r):pick(['sword1h','sword2h','dagger','dao','axe','bow','staff','wand','book','whip','mace'],r)}
  else if(slot==='offhand')kind=pick(offs,r);
  else if(slot==='head')kind=r()<.65?pick(fam.hs,r):pick(['cap','helm','hat','hood'],r);
  else if(slot==='body')kind=r()<.65?pick(fam.bs,r):pick(['tunic','plate','robe','leather'],r);
  else kind=slot==='neck'?'neck':slot;
  return mk(slot,kind,t,rollRar(r,boost||0));
}
function sellP(it){return it.f?0:Math.round((8+it.tier*10)*RAR[it.rar].m)}
function buyP(it){return Math.max(20,sellP(it)*4)}

function findItem(id){
  var i,it;
  for(i=0;i<SLOTS.length;i++){it=S.eq[SLOTS[i]];if(it&&it.id===id)return it}
  for(i=0;i<S.inv.length;i++)if(S.inv[i].id===id)return S.inv[i];
  if(S.shop)for(i=0;i<S.shop.items.length;i++)if(S.shop.items[i].id===id)return S.shop.items[i];

}

/* ---------- game math ---------- */
function lvl(xp){
  var l=1,need=50;xp=Math.max(0,xp);
  while(xp>=need&&l<MAXLV){xp-=need;l++;need=50+30*(l-1)+3*(l-1)*(l-1)}
  if(l>=MAXLV)return{l:l,cur:need,need:need};
  return{l:l,cur:xp,need:need};
}
function petVal(p){
  var d=PET[p.id],v=PBASE[d.r]*p.lv;
  if(d.eff==='sta')v*=3;if(d.eff==='atk')v*=2;
  return Math.round(v*10)/10;
}
var PEFF={gold:'🪙 Vàng +#%',xp:'📘 EXP +#%',atk:'⚔️ Tấn công +#',luck:'🍀 May mắn +#%',sta:'⚡ Thể lực +#'};
function stats(){
  var L=lvl(S.xp).l,a={atk:8+L*2,sta:100+L,luck:0,xp:0,gold:0,crit:5,guard:0,regen:5,dmgp:0};
  SLOTS.forEach(function(s){var it=S.eq[s];if(!it)return;var st=it.st;
    a.atk+=st.atk||0;a.sta+=st.sta||0;a.luck+=st.luck||0;a.xp+=st.xp||0;a.gold+=st.gold||0;a.regen+=st.regen||0});
  for(var id in S.skills){var s=SKM[id],lv=S.skills[id];if(!s||!lv)continue;var v=s.per*lv;
    if(s.eff==='dmg')a.dmgp+=v;else if(s.eff==='stam')a.sta+=v;else if(s.eff==='drop')a.luck+=v;else a[s.eff]+=v}
  var c=CLM[S.cls],e=FAM[c.fam].eff;
  if(e&&c.tier){var cv=c.tier*5;if(e==='dmg')a.dmgp+=cv;else if(e==='drop')a.luck+=cv;else a[e]+=cv}
  var pa=S.pets.filter(function(p){return p.id===S.petAct})[0];
  if(pa){var pd=PET[pa.id],pv=petVal(pa);
    if(pd.eff==='gold')a.gold+=pv;else if(pd.eff==='xp')a.xp+=pv;else if(pd.eff==='atk')a.atk+=pv;else if(pd.eff==='luck')a.luck+=pv;else a.sta+=pv}
  a.guard=Math.min(60,a.guard);
  a.atk=Math.round(a.atk);a.sta=Math.round(a.sta);
  return a;
}
function regen(){
  var now=Date.now(),st=stats(),h=(now-(S.stamT||now))/3600000;
  S.stamT=now;if(h>0)S.stam=Math.min(st.sta,S.stam+h*st.regen);
  if(S.stam>st.sta)S.stam=st.sta;
}
function grantXp(base){
  var st=stats(),x=Math.max(1,Math.round(base*(1+st.xp/100))),b=lvl(S.xp).l;
  S.xp+=x;petXp(Math.round(x*.5));
  var a=lvl(S.xp).l;
  if(a>b){
    var tk=0;
    for(var l=b+1;l<=a;l++){S.sp+=2;if(l%5===0){S.tickets++;tk++}}
    var msg='Bé đã lên cấp '+a+'! Nhận +'+(2*(a-b))+' điểm kỹ năng.';
    if(tk)msg+=' Nhận '+tk+' 🎫 vé đổi class!';
    var un=CL.filter(function(c){return c.minLv>b&&c.minLv<=a&&c.tier>0}).map(function(c){return c.tier}).filter(function(v,i,s){return s.indexOf(v)===i});
    if(un.length)msg+=' Mở khóa các class mới!';
    Q.push(modalHtml('🎉','Lên cấp '+a+'!',msg,'<button class="btn" data-act="closeModal">Tuyệt vời!</button>'));
  }
  return x;
}
function petXp(n){
  var p=S.pets.filter(function(x){return x.id===S.petAct})[0];if(!p||n<=0)return;
  p.xp+=n;
  while(p.lv<10&&p.xp>=60*p.lv){p.xp-=60*p.lv;p.lv++;toast('🐾 '+PET[p.id].n+' lên cấp '+p.lv+'!')}
  if(p.lv>=10)p.xp=0;
}

  var crit=Math.random()*100<st.crit,dmg=Math.round(st.atk*(1+st.dmgp/100)*(0.85+Math.random()*0.3));

  res.xp=grantXp(10);var g=Math.round(rnd(3,8)*(1+st.gold/100));S.gold+=g;res.gold=g;
  if(m.hp<=0){
    res.killed=true;m.kills=(m.kills||0)+1;
    res.xp+=grantXp(40*m.tier);
    var kg=Math.round((30+30*m.tier)*(1+st.gold/100));S.gold+=kg;res.gold+=kg;
    if(Math.random()<Math.min(.95,.55+st.luck/100))addInv(dropItem(Math.random,m.tier-1),res);
    if(m.tier>=2&&Math.random()<.2+st.luck/200)addInv(dropItem(Math.random,m.tier-1),res);

/* ---------- penalties ---------- */
function penAmt(){return Math.max(1,Math.round(8*(1-stats().guard/100)))}
function penalizeDay(k,final,cap){
  var L=dayLog(k),now=Date.now(),res=[];
  S.quests.forEach(function(q){
    if(q.type!=='daily'||q.days.indexOf(dow(k))<0)return;
    if(L.q.indexOf(q.id)>=0||L.pen.indexOf(q.id)>=0)return;
    var due=dueTs(k,q.time);
    if(due<(q.since||S.since))return;
    if(!final&&now<due+60*60000)return;
    L.pen.push(q.id);
    var a=penAmt();if(cap&&cap.left<=0)return;
    if(cap)cap.left-=a;
    S.stam=Math.max(0,S.stam-a);res.push(q.title+' (−'+a+'⚡)');
  });
  return res;
}
function settle(){
  var tk=today();
  if(!S.last)S.last=tk;
  var d=parseKey(S.last),n=0,cap={left:40},list=[];
  while(keyOf(d)<tk&&n<30){
    var r=penalizeDay(keyOf(d),true,cap);
    if(r.length)list.push(d.getDate()+'/'+(d.getMonth()+1)+': '+r.join(', '));
    d.setDate(d.getDate()+1);n++;
  }
  S.last=tk;
  var wk=weekKey(new Date());
  if(!S.wlast)S.wlast=wk;
  if(S.wlast!==wk){
    var W=S.week[S.wlast]||{prog:{},pen:[]};
    S.quests.forEach(function(q){
      if(q.type!=='weekly')return;
      if((q.since||S.since)>parseKey(wk).getTime())return;
      if((W.prog[q.id]||0)>=q.target||(W.pen||[]).indexOf(q.id)>=0)return;
      var a=penAmt()*2;S.stam=Math.max(0,S.stam-a);list.push('Tuần trước: '+q.title+' (−'+a+'⚡)');
    });
    S.wlast=wk;
  }
  if(list.length)notes.push('Bé đã quên:\n'+list.join('\n'));
}
function penalizeToday(){
  var r=penalizeDay(today(),false);
  if(r.length)toast('Quên nhiệm vụ: '+r.join(', '));
  return r.length;
}

function paint(){
  var list=document.querySelectorAll('canvas[data-k]');
  for(var i=0;i<list.length;i++){
    var cv=list[i],k=cv.getAttribute('data-k'),id=cv.getAttribute('data-id');
    try{
      if(k==='hero')drawHero(cv,cv.getAttribute('data-draft')?{hero:draft,cls:'novice',eq:{}}:{hero:S.hero,cls:S.cls,eq:visualEquipment()});
      else if(k==='pet')drawPet(cv,id);
      else if(k==='mon')drawMon(cv,cv.getAttribute('data-kind'));
      else if(k==='item')drawItem(cv,findItem(id));
      else if(k==='scene')drawScene(cv,cv.getAttribute('data-m'));
    }catch(e){}
  }

      if(!S.dungeon)S.dungeon={week:'',clears:0,claimed:false};

    finally{input.value='';}
  };
  reader.onerror=function(){toast('Không đọc được file lưu');input.value='';};
  reader.readAsText(file);
});
